services:
  db:
    image: postgis/postgis:14-3.5
    environment:
      POSTGRES_DB: GIS
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d GIS"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - gis-data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/GIS
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JPA_SHOW_SQL: "false"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  gis-data:

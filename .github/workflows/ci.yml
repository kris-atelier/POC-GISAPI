name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:14-3.5
        env:
          POSTGRES_DB: GIS
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d GIS"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/GIS
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JPA_SHOW_SQL: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test and build
        run: ./gradlew clean test bootJar --no-daemon

      - name: Build application image
        run: docker build -t poc-gisapi .

      - name: Run application container
        run: >-
          docker run -d --name poc-gisapi
          --network host
          -e DB_URL=jdbc:postgresql://localhost:5432/GIS
          -e DB_USERNAME=postgres
          -e DB_PASSWORD=postgres
          -e JPA_SHOW_SQL=false
          poc-gisapi

      - name: Smoke test API
        run: |
          for i in {1..30}; do
            if curl --fail --silent 'http://localhost:8080/Polygon/GetAll?page=0&size=1' > /tmp/response.json; then
              cat /tmp/response.json
              exit 0
            fi
            sleep 2
          done
          docker logs poc-gisapi
          exit 1
